[project]
name = "portfolio-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "langgraph>=0.2",
    "requests>=2.31",
    "mem0ai>=2.0",
    "fastembed>=0.8",
    "flask>=3.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
