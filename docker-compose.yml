# Local dev only. Production targets the managed stack described in
# adr/0019-infrastructure-unified-managed-stack.md (Neon/Supabase-style
# managed Postgres, Upstash-style managed Redis) — this file exists so
# src/infrastructure_postgres.py has something real to run against on a
# developer's machine, not as a production deployment description.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: portfolio_agent
      POSTGRES_PASSWORD: portfolio_agent
      POSTGRES_DB: portfolio_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Real, enforced resource ceiling -- issue #77 (performance validation)
    # needs a concrete "allocated database instance capacity" to measure
    # CPU usage against; without one, "does not exceed 70%" has nothing
    # real to be 70% of. 2 CPUs is a believable local stand-in for a
    # small managed Postgres instance size.
    deploy:
      resources:
        limits:
          cpus: "2.0"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
